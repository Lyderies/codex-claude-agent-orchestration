name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Identifier guard (files and commit identities)
        run: python scripts/check_identifiers.py --commits HEAD
      - name: Ruff
        run: |
          python -m pip install --disable-pip-version-check ruff==0.16.3
          ruff check .
      - name: Repository tests
        run: python scripts/ci_unittest.py tests
      - name: Codex agents package tests
        working-directory: packages/codex-agents
        run: python ../../scripts/ci_unittest.py tests
      - name: Claude agents package tests
        working-directory: packages/claude-agents
        env:
          PYTHONPATH: src
        run: python ../../scripts/ci_unittest.py tests
