name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Identifier guard (files and commit identities)
        run: python scripts/check_identifiers.py --commits HEAD
      - name: Ruff
        run: |
          python -m pip install --disable-pip-version-check ruff==0.16.3
          ruff check .
      - name: Tests
        run: python -m unittest discover -s tests -v
